name: minecraft
services:
  minecraft:
    container_name: minecraft
    image: itzg/minecraft-server:latest
    init: true
    stop_grace_period: 5m
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "24454:24454/udp"
      - "8100:8080"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      JAVA_VERSION: 25
      VERSION: "26.3"
      MEMORY: "5G"
      MAX_PLAYERS: "10"
      ENABLE_AUTOPAUSE: "false"
      PAUSE_WHEN_EMPTY_SECONDS: "60"
      MAX_TICK_TIME: "-1"
      MOTD: "§r           §f§lSurvival§f §oForever World§f  [26.3]§r\n§f§l              Network: §9§n§olacto.vip"
      TZ: ${TZ:-America/Santiago}
      DIFFICULTY: "3"
      FORCE_GAMEMODE: "true"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "175"
      SIMULATION_DISTANCE: "10"
      VIEW_DISTANCE: "10"
      ENABLE_WHITELIST: "true"
    volumes:
      - "./data:/data"
    networks:
      - default

networks:
  default:
    name: caddy_net
    external: true
