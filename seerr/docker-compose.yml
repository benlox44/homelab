name: seerr
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    stop_grace_period: 2m
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    networks:
      default:
        aliases:
          - jellyseerr

networks:
  default:
    name: caddy_net
    external: true
