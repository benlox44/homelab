name: prowlarr
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    stop_grace_period: 2m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santiago
    volumes:
      - ./config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: caddy_net
    external: true


