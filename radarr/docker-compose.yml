name: radarr
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    stop_grace_period: 2m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${MEDIA_DIR}:/data

    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: caddy_net
    external: true


