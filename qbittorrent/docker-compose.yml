name: qbittorrent
services:

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - ${MEDIA_DIR}:/data

    expose:
      - 8080
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "8080:8080"

networks:
  default:
    name: caddy_net
    external: true


